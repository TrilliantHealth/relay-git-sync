name: Snapshot companion checks
on:
  pull_request:
    paths:
      - 'snapshot_*.py'
      - 'relay_client.py'
      - 'relay_sdk/**'
      - 'models.py'
      - 's3rn.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Dockerfile.snapshot'
      - '.dockerignore'
      - 'scripts/*snapshot*'
      - 'tests/**'
      - '.github/workflows/snapshot-export.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install matching lock tool
        run: python -m pip install uv==0.12.3
      - run: uv sync --frozen
      - run: uv run --frozen pytest
      - run: uv build --wheel
      - run: uv run --frozen python scripts/check-snapshot-wheel.py
      - run: uv run --frozen python scripts/snapshot-smoke.py
      - name: Build and run unprivileged credential-free image smoke
        run: docker build --file Dockerfile.snapshot --target smoke --tag relay-snapshot-smoke .
